name: Chrome Web Store Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: package
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          mkdir -p packages
          ZIP_PATH="packages/human-mode-extension-$VERSION.zip"
          (cd dist && zip -qr "../$ZIP_PATH" .)
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
      - id: token
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          RESPONSE="$(curl -sS https://oauth2.googleapis.com/token \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d "client_id=$CWS_CLIENT_ID")"
          ACCESS_TOKEN="$(node -e "const data=JSON.parse(process.argv[1]); if (!data.access_token) { throw new Error(JSON.stringify(data)); } process.stdout.write(data.access_token);" "$RESPONSE")"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Upload package
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          curl -sS -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            -T "$ZIP_PATH" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:upload"
      - name: Publish
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          curl -sS -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:publish"
